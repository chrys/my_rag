                items:
                  $ref: '#/components/schemas/APIUsage'

  /usage/by_endpoint/:
    get:
      summary: Filter Usage by Endpoint Path
      operationId: getAPIUsageByEndpoint
      tags:
        - API Telemetry
      parameters:
