  /documents/failed/:
    get:
      summary: List Failed Documents
      description: Retrieve all documents that failed indexing.
      operationId: listFailedDocuments
      tags:
        - Documents
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
