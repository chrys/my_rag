  /documents/by_state/:
    get:
      summary: Filter Documents by Ingestion State
      description: Filter documents by status (PENDING, INDEXING, INDEXED, FAILED).
      operationId: listDocumentsByState
      tags:
        - Documents
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            enum: [PENDING, INDEXING, INDEXED, FAILED]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentList'

  /documents/indexed/:
    get:
      summary: List Indexed Documents
      description: Retrieve all successfully indexed documents.
      operationId: listIndexedDocuments
      tags:
        - Documents
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
