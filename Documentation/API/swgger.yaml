                  $ref: '#/components/schemas/APIUsage'

  /usage/summary/:
    get:
      summary: Get API Telemetry Analytics Summary
      operationId: getAPIUsageSummary
      tags:
        - API Telemetry
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIUsageSummary'

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Secret API key header
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django session cookie

  schemas:
    ChatQueryRequest:
      type: object
      required:
        - store_id
        - query
      properties:
        store_id:
          type: string
          description: Target project store identifier (e.g. postgres_123, google_store_abc, local_store)
          example: "postgres_myproject"
        query:
          type: string
          description: User question or natural language prompt
          example: "What is our company policy on remote work?"
        system_prompt:
          type: string
          description: Optional transient system prompt override
          example: "Answer concisely in bullet points."

    ChatQueryResponse:
      type: object
      properties:
        user_message:
          type: string
          example: "What is our company policy on remote work?"
        bot_response:
          type: string
          description: Markdown-formatted answer
          example: "Our remote work policy allows full-time employees up to 2 remote days per week."
        bot_response_html:
          type: string
          description: HTML-rendered answer
          example: "<p>Our remote work policy allows full-time employees up to 2 remote days per week.</p>"
        source_documents:
          type: array
          items:
            type: string
          description: Deduplicated list of source documents used in RAG context
          example: ["employee_handbook_2026.pdf"]

    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project_id:
          type: string
          example: "proj_finance_2026"
        display_name:
          type: string
          example: "Finance Department Knowledge Base"
        storage_type:
          type: string
          enum: [local, google, postgres]
          example: "postgres"
        external_store_id:
          type: string
          nullable: true
          example: "fileSearchStores/mystore-12345"
        description:
          type: string
          nullable: true
          example: "Contains Q1-Q4 internal financial documentation."
        is_active:
          type: boolean
          example: true
        document_count:
          type: integer
          readOnly: true
          example: 12
        last_indexed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        system_prompt:
          $ref: '#/components/schemas/SystemPrompt'

    ProjectList:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: string
        display_name:
          type: string
        storage_type:
          type: string
        document_count:
          type: integer
        created_at:
          type: string
          format: date-time
        is_active:
          type: boolean

    ProjectCreate:
      type: object
      required:
        - project_id
        - display_name
        - storage_type
      properties:
        project_id:
          type: string
          example: "proj_legal"
        display_name:
          type: string
          example: "Legal & Compliance Knowledge Base"
        storage_type:
          type: string
          enum: [local, google, postgres]
          example: "postgres"
        description:
          type: string
          example: "Legal terms, NDAs, and contract templates."

    ProjectUpdate:
      type: object
      properties:
        display_name:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    SystemPrompt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          description: Associated Project PK ID
        content:
          type: string
          example: "You are a professional assistant providing legal guidance."
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        document_name:
          type: string
          example: "nda_template.pdf"
        display_name:
          type: string
          example: "NDA Standard Template"
        external_document_id:
          type: string
          nullable: true
        mime_type:
          type: string
          example: "application/pdf"
        file_size:
          type: integer
          example: 1048576
        state:
          type: string
          enum: [PENDING, INDEXING, INDEXED, FAILED]
          example: "INDEXED"
        indexed_at:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    DocumentList:
      type: object
      properties:
        id:
          type: integer
        document_name:
          type: string
        display_name:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time

    DocumentCreate:
      type: object
      required:
        - project
        - document_name
        - display_name
      properties:
        project:
          type: integer
        document_name:
          type: string
        display_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer

    DocumentUpdate:
      type: object
      properties:
        display_name:
          type: string
        state:
          type: string
          enum: [PENDING, INDEXING, INDEXED, FAILED]
        error_message:
          type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        user:
          type: integer
          nullable: true
        user_username:
          type: string
          readOnly: true
        message_type:
          type: string
          enum: [user, bot, system]
        content:
          type: string
        response_html:
          type: string
          readOnly: true
        context_documents:
          type: array
          items:
            type: string
        system_prompt_used:
          type: string
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true

    ChatMessageList:
      type: object
      properties:
        id:
          type: integer
        message_type:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        session_id:
          type: string

    ChatMessageCreate:
      type: object
      required:
        - project
        - message_type
        - content
      properties:
        project:
          type: integer
        message_type:
          type: string
          enum: [user, bot, system]
        content:
          type: string
        session_id:
          type: string

    EvaluationDataset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project:
          type: integer
        document:
          type: integer
          nullable: true
        question:
          type: string
        ground_truth:
          type: string
        source:
          type: string
          enum: [manual, generated, csv]
        created_at:
          type: string
          format: date-time

    EvaluationRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project:
          type: integer
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        error_message:
          type: string
          nullable: true

    EvaluationResultMetrics:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run:
          type: string
          format: uuid
        dataset_item:
          type: string
          format: uuid
        context_recall:
          type: number
          format: float
        context_precision:
          type: number
          format: float
        faithfulness:
          type: number
          format: float
        answer_relevancy:
          type: number
          format: float

    APIKey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_username:
          type: string
          readOnly: true
        key:
          type: string
          readOnly: true
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    APIKeyList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    APIKeyCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Production Integration Key"
        is_active:
          type: boolean
          default: true
        key:
          type: string
          readOnly: true

    APIUsage:
      type: object
      properties:
        id:
          type: integer
        api_key:
          type: integer
        api_key_name:
          type: string
        endpoint:
          type: string
        method:
          type: string
        status_code:
          type: integer
        response_time_ms:
          type: integer
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time

    APIUsageList:
      type: object
      properties:
        id:
          type: integer
        endpoint:
          type: string
        method:
          type: string
        status_code:
          type: integer
        response_time_ms:
          type: integer
        created_at:
          type: string
          format: date-time

    APIUsageSummary:
      type: object
      properties:
        total_requests:
          type: integer
          example: 1450
        requests_last_24h:
          type: integer
          example: 120
        avg_response_time_ms:
          type: number
          example: 245.5
        error_count:
          type: integer
          example: 3
        by_endpoint:
          type: array
          items:
            type: object
            properties:
              endpoint:
                type: string
              count:
                type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Missing store_id or query"
        detail:
          type: string
          example: "Invalid credentials provided."
