      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreate'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'

  /messages/{id}/:
    get:
      summary: Get Chat Message Details
      operationId: getChatMessage
      tags:
        - Chat Messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'

  /messages/by_project/:
    get:
      summary: List Messages by Project
      operationId: listMessagesByProject
      tags:
        - Chat Messages
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
