      summary: Get Evaluation Run Details
      operationId: getEvaluationRun
      tags:
        - Evaluation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'

  /results/:
