  /documents/{document_id}:
    delete:
      summary: Delete Document by Filename
      description: Catch-all route to delete a document when the filename contains dots (e.g. report.pdf).
      operationId: deleteDocumentByFilename
      tags:
        - Documents
      parameters:
        - name: document_id
          in: path
          required: true
          description: Document filename or identifier
          schema:
            type: string
        - name: store_id
          in: query
          required: false
          description: Store ID for removing document from vector index
          schema:
            type: string
      responses:
        '204':
          description: Document deleted successfully

  /documents/{id}/:
    get:
      summary: Get Document Details
      description: Retrieve document details by numeric ID or exact document name.
      operationId: getDocument
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found
    put:
      summary: Update Document Metadata
      operationId: updateDocument
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdate'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
    delete:
      summary: Delete Document
      description: Delete document from database and vector store if store_id provided.
      operationId: deleteDocument
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: store_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Document deleted

  /messages/:
