      operationId: listSystemPrompts
      tags:
        - Prompts
      responses:
        '200':
          description: List of system prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemPrompt'
    post:
      summary: Create System Prompt
      description: Create a system prompt for a project.
      operationId: createSystemPrompt
      tags:
        - Prompts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPrompt'
      responses:
        '201':
          description: System prompt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPrompt'

  /prompts/{id}/:
    get:
      summary: Get System Prompt
      description: Get details of a system prompt by ID.
      operationId: getSystemPrompt
      tags:
        - Prompts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPrompt'
    put:
      summary: Update System Prompt
      operationId: updateSystemPrompt
      tags:
        - Prompts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemPrompt'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemPrompt'
    delete:
      summary: Delete System Prompt
      operationId: deleteSystemPrompt
      tags:
        - Prompts
      parameters:
