openapi: 3.0.3
info:
  title: My RAG Platform API
  description: |
    Enterprise API for Retrieval-Augmented Generation (RAG). Supports multi-backend knowledge base management,
    document ingestion and indexing, context-aware query processing with verifiable source citations, AI persona prompt governance,
    quantitative evaluation benchmarking, and API key usage analytics.
  version: 1.0.0
servers:
  - url: /rag/api
    description: Base URL for My RAG API endpoints

security:
  - apiKeyAuth: []
  - basicAuth: []
  - cookieAuth: []

paths:
  # ==========================================
  # SYSTEM CONNECTIVITY & HEALTH
  # ==========================================
  /ping/:
    get:
      summary: Lightweight Connectivity Ping
      description: |
        Ultra-low-latency in-memory response (<1ms) with zero database queries.
        Used by external applications, microservices, and load balancers to verify service availability.
        Requires authentication via shared health secret (`X-Health-Key`, `Authorization: Bearer <key>`, or `?key=<key>`) or active API key.
      operationId: pingCheck
      tags:
        - Health
      security:
        - healthKeyAuth: []
        - apiKeyAuth: []
      parameters:
        - name: key
          in: query
          required: false
          description: Optional query parameter alternative to `X-Health-Key`
          schema:
            type: string
            example: rag-health-secret-key
      responses:
        '200':
          description: Service is reachable and responding
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "pong"
                  service:
                    type: string
                    example: "my_rag"
                  timestamp:
                    type: string
                    format: date-time
        '403':
          description: Invalid or missing health key

  /health/:
    get:
      summary: Deep Health Check with Cached Database Connectivity
      description: |
        Verifies API service responsiveness and PostgreSQL database connectivity.
        Database connectivity checks are cached for 15 seconds to prevent connection pool exhaustion under load.
        Requires authentication via shared health secret (`X-Health-Key`, `Authorization: Bearer <key>`, or `?key=<key>`) or active API key.
      operationId: healthCheck
      tags:
        - Health
      security:
        - healthKeyAuth: []
        - apiKeyAuth: []
      parameters:
        - name: key
          in: query
          required: false
          description: Optional query parameter alternative to `X-Health-Key`
          schema:
            type: string
            example: rag-health-secret-key
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "my_rag"
                  database:
                    type: string
                    example: "connected"
                  cached:
                    type: boolean
                    example: true
                  timestamp:
                    type: string
                    format: date-time
        '403':
          description: Invalid or missing health key
        '503':
          description: Database connectivity degraded or failed

  # ==========================================
  # CHAT & CONVERSATION
  # ==========================================
  /chat/:
    post:
      summary: Direct RAG Chat Query
      description: Execute a natural language query against a project knowledge base using RAG vector search and LLM synthesis.
      operationId: chatQuery
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQueryRequest'
      responses:
        '200':
          description: Successful query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueryResponse'
        '400':
          description: Missing required fields (store_id or query)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access forbidden for requested store/project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/:
    get:
      summary: List User Projects
      description: Retrieve all projects owned by the authenticated user.
      operationId: listProjects
      tags:
        - Projects
      responses:
        '200':
          description: List of user projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectList'
    post:
      summary: Create Project
      description: Create a new knowledge base project store.
      operationId: createProject
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input or unsupported storage type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/active/:
    get:
      summary: List Active Projects
      description: Retrieve all active projects for the authenticated user.
      operationId: listActiveProjects
      tags:
        - Projects
      responses:
        '200':
          description: List of active projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectList'

  /projects/by_storage/:
    get:
      summary: Filter Projects by Storage Engine
      description: Retrieve projects filtered by backend storage type (local, google, postgres).
      operationId: filterProjectsByStorage
      tags:
        - Projects
      parameters:
        - name: type
          in: query
          required: true
          description: Storage engine type
          schema:
            type: string
            enum: [local, google, postgres]
      responses:
        '200':
          description: Filtered list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectList'
        '400':
          description: Storage type parameter missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{id}/:
    get:
      summary: Get Project Details
      description: Retrieve details for a project. Supports lookup by primary key ID, project_id string, or external_store_id.
      operationId: getProject
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          description: Primary Key, project_id, or external_store_id
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Project
      description: Update display name, description, or status of a project.
      operationId: updateProject
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    patch:
      summary: Partially Update Project
      description: Partially update project settings.
      operationId: patchProject
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      summary: Delete Project
      description: Permanently delete a project and associated resources.
      operationId: deleteProject
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Project deleted successfully

  /projects/{id}/prompt/:
    get:
      summary: Get Project System Prompt
      description: Retrieve the active system prompt bound to this project.
      operationId: getProjectPrompt
      tags:
        - Projects
        - Prompts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: System prompt content
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt:
                    type: string
                    example: "You are an expert financial analysis assistant."
    post:
      summary: Set Project System Prompt
      description: Set or update the system prompt governing AI persona and rules for this project.
      operationId: setProjectPrompt
      tags:
        - Projects
        - Prompts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: System prompt instructions content
                  example: "You are an expert customer support agent."
                prompt:
                  type: string
                  description: Legacy key alternative for content
      responses:
        '200':
          description: Prompt saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  prompt:
                    type: string

  /projects/{id}/documents/:
    get:
      summary: Get Project Documents
      description: Retrieve all documents associated with a specific project.
      operationId: getProjectDocuments
      tags:
        - Projects
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of project documents
          content:
