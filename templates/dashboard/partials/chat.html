<article id="chat-section" style="height: calc(100vh - 160px); display: flex; flex-direction: column; margin-bottom: 0;">
    <header style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--pico-card-border-color, #e2e8f0);">
        <div>
            <h3 style="margin: 0; font-size: 1.15rem;">💬 Chat Workflow</h3>
            <span style="font-size: 0.8rem; color: var(--pico-muted-color);">
                Project: <strong>{{ current_project.display_name }}</strong> | Model: <code class="font-mono">{{ current_project.llm_model }}</code>
            </span>
        </div>
        <div>
            <button type="button" class="outline secondary" style="padding: 0.25rem 0.65rem; font-size: 0.75rem; margin-bottom: 0;"
                    onclick="document.getElementById('chat-messages-container').innerHTML = ''">
                🧹 Clear Chat
            </button>
        </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <div id="chat-messages-container" style="flex: 1; overflow-y: auto; padding: 0.5rem 0; display: flex; flex-direction: column; gap: 1rem;">
        <div style="background: var(--pico-card-background-color); border: 1px solid var(--pico-card-border-color, #e2e8f0); border-radius: var(--pico-border-radius); padding: 1rem;">
            <p style="margin: 0; font-size: 0.9rem;">
                👋 Hello! Ask any question about your indexed documents in <strong>{{ current_project.display_name }}</strong>.
            </p>
        </div>
    </div>

    <!-- Chat Input Area -->
    <footer style="margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--pico-card-border-color, #e2e8f0);">
        <form id="chat-stream-form" onsubmit="event.preventDefault(); submitChatStream('{{ current_project.project_id }}');" style="margin-bottom: 0;">
            <div style="display: flex; gap: 0.75rem; align-items: center; width: 100%;">
                <input type="text" id="chat-user-input" placeholder="Ask a question about your project documents..." 
                       style="margin-bottom: 0; flex: 1 1 auto; width: 100%; min-width: 0; padding: 0.6rem 0.85rem;" autocomplete="off" required>
                <button type="submit" id="chat-send-btn" class="primary" 
                        style="margin-bottom: 0; padding: 0.6rem 1.5rem; width: auto; flex-shrink: 0; white-space: nowrap; font-weight: 600;">
                    Send 🚀
                </button>
            </div>
        </form>
    </footer>
</article>

<script>
    function submitChatStream(projectId) {
        const input = document.getElementById('chat-user-input');
        const container = document.getElementById('chat-messages-container');
        const query = input.value.trim();
        if (!query) return;

        // Render User Bubble
        const userDiv = document.createElement('div');
        userDiv.style = 'align-self: flex-end; max-width: 80%; background: var(--pico-primary); color: #fff; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.9rem;';
        userDiv.textContent = query;
        container.appendChild(userDiv);
        input.value = '';

        // Render AI Response Bubble with loading state
        const aiDiv = document.createElement('div');
        aiDiv.style = 'align-self: flex-start; max-width: 85%; background: var(--pico-card-background-color); border: 1px solid var(--pico-card-border-color, #e2e8f0); padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.9rem;';
        aiDiv.innerHTML = '<em>Thinking...</em>';
        container.appendChild(aiDiv);
        container.scrollTop = container.scrollHeight;

        const csrfEl = document.querySelector('meta[name="csrf-token"]');
        const csrfToken = csrfEl ? csrfEl.getAttribute('content') : '';

        // Perform request
        fetch('/rag/api/chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                query: query,
                store_id: projectId
            })
        }).then(async res => {
            const contentType = res.headers.get('content-type') || '';
            if (contentType.includes('application/json')) {
                const data = await res.json();
                if (data.error) {
                    aiDiv.innerHTML = `<span style="color: #b91c1c;">⚠️ ${data.error}</span>`;
                    return;
                }
                const responseHtml = data.bot_response_html || data.bot_response || data.response || 'No response returned.';
                let formattedHtml = `<div style="line-height: 1.5;">${responseHtml}</div>`;
                
                if (data.source_documents && data.source_documents.length > 0) {
                    formattedHtml += `<div style="margin-top: 0.75rem; padding-top: 0.5rem; border-top: 1px dashed var(--pico-card-border-color, #cbd5e1); font-size: 0.8rem; color: var(--pico-muted-color);">
                        📚 <strong>Sources:</strong> ${data.source_documents.join(', ')}
                    </div>`;
                }
                if (data.response_time) {
                    formattedHtml += `<div style="margin-top: 0.25rem; font-size: 0.75rem; color: var(--pico-muted-color); text-align: right;">
                        ⏱ ${data.response_time}
                    </div>`;
                }
                aiDiv.innerHTML = formattedHtml;
                container.scrollTop = container.scrollHeight;
            } else {
                // Streaming SSE fallback
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                aiDiv.innerHTML = '';

                function read() {
                    reader.read().then(({done, value}) => {
                        if (done) return;
                        const text = decoder.decode(value);
                        const lines = text.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.substring(6));
                                    if (data.token) {
                                        aiDiv.innerText += data.token;
                                        container.scrollTop = container.scrollHeight;
                                    }
                                } catch(e) {}
                            }
                        }
                        read();
                    });
                }
                read();
            }
        }).catch(err => {
            aiDiv.innerHTML = '<span style="color: #b91c1c;">Error generating response. Please check server logs.</span>';
        });
    }
</script>
