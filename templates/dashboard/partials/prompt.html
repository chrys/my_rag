<article id="prompt-section" x-data="{ customEnabled: {{ current_project.custom_prompt|yesno:'true,false' }} }">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
            <h3 style="margin: 0;">📝 System Prompt & Persona</h3>
            <p style="margin: 0; font-size: 0.85rem; color: var(--pico-muted-color);">
                Customize the AI persona, factuality constraints, and system instructions for <strong>{{ current_project.display_name }}</strong>.
            </p>
        </div>
    </header>

    {% if success_message %}
    <div style="padding: 0.75rem 1rem; background-color: #dcfce7; color: #166534; border-radius: var(--pico-border-radius); margin-bottom: 1.25rem; font-size: 0.9rem; font-weight: 500;">
        ✅ {{ success_message }}
    </div>
    {% endif %}

    <form hx-post="{% url 'projects:prompt' current_project.project_id %}" 
          hx-target="#dashboard-workspace" 
          hx-swap="innerHTML">
        {% csrf_token %}

        <div style="margin-bottom: 1.25rem;">
            <label for="custom_prompt_toggle">
                <input type="checkbox" id="custom_prompt_toggle" name="custom_prompt" x-model="customEnabled" {% if current_project.custom_prompt %}checked{% endif %}>
                <strong>Enable Custom System Prompt</strong>
            </label>
            <small style="color: var(--pico-muted-color); display: block; margin-top: 0.25rem;">
                When disabled, default balanced RAG instructions will be applied.
            </small>
        </div>

        <div x-show="customEnabled" x-transition style="margin-bottom: 1.25rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <label for="prompt_text" style="font-weight: 600; margin-bottom: 0;">System Prompt Instructions</label>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="outline secondary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;"
                            onclick="document.getElementById('prompt_text').value = 'You are an accurate, concise AI assistant for our technical documentation. Always cite references and never invent facts.'">
                        Technical Preset
                    </button>
                    <button type="button" class="outline secondary" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;"
                            onclick="document.getElementById('prompt_text').value = 'You are a friendly customer service agent. Explain answers step-by-step using clear, accessible language.'">
                        Support Preset
                    </button>
                </div>
            </div>

            <textarea id="prompt_text" name="prompt_text" rows="10" class="font-mono"
                      placeholder="Enter system instructions, persona rules, and guidelines...">{{ prompt_content }}</textarea>
        </div>

        <footer style="display: flex; justify-content: flex-end; margin-top: 1.5rem;">
            <button type="submit" class="primary" style="padding: 0.5rem 1.5rem;">
                💾 Save System Prompt
            </button>
        </footer>
    </form>
</article>
