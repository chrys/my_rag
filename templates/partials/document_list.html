<div class="h-full flex flex-col">
    <!-- Header -->
    <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
        <div>
            <h2 class="font-semibold text-gray-700">{{ project_name }}</h2>
            <p class="text-xs text-gray-500">{{ store_id }}</p>
        </div>
        <form hx-post="{{ url_prefix }}/documents/{{ store_id }}/upload/" hx-encoding="multipart/form-data"
            hx-target="#document-list" hx-swap="innerHTML" class="flex flex-wrap items-center gap-3">
            
            <!-- Custom Styled Choose File Button -->
            <div class="flex items-center gap-2">
                <label for="file-uploader-input" 
                    class="cursor-pointer bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 px-3 py-1.5 rounded-md text-sm font-medium transition-all shadow-sm hover:shadow flex items-center gap-1.5 select-none active:scale-[0.98]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V4a2 2 0 012-2h6l2 2h6a2 2 0 012 2v7m-18 10h18a2 2 0 002-2v-4a2 2 0 00-2-2H9l-2-2H3a2 2 0 00-2 2v4a2 2 0 002 2z" />
                    </svg>
                    <span>Choose File</span>
                </label>
                <input type="file" id="file-uploader-input" name="file" required class="hidden" 
                    onchange="const nameSpan = document.getElementById('selected-file-name'); if (this.files && this.files[0]) { nameSpan.textContent = this.files[0].name; nameSpan.classList.remove('text-gray-400'); nameSpan.classList.add('text-gray-700', 'font-medium'); } else { nameSpan.textContent = 'No file chosen'; nameSpan.classList.remove('text-gray-700', 'font-medium'); nameSpan.classList.add('text-gray-400'); }">
                <span id="selected-file-name" class="text-xs text-gray-400 max-w-[120px] sm:max-w-[180px] truncate select-none">No file chosen</span>
            </div>

            <!-- Chunking Strategy Selector -->
            <div class="flex items-center gap-2 border-l border-gray-200 dark:border-gray-700 pl-3">
                <select name="chunking_strategy" id="chunking-strategy-select"
                    class="border border-gray-300 dark:border-gray-700 rounded-md px-2 py-1 text-xs text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="auto_detect" selected>Auto-Detect</option>
                    <option value="markdown">Markdown Header</option>
                    <option value="code">Code / AST</option>
                    <option value="hierarchical">Hierarchical</option>
                    <option value="sentence">Sentence Boundary</option>
                </select>
            </div>

            <!-- Expiration Tracking -->
            <div class="flex items-center gap-2 border-l border-gray-200 dark:border-gray-700 pl-3">
                <label class="flex items-center gap-1.5 cursor-pointer text-sm text-gray-600 dark:text-gray-300 font-medium select-none">
                    <input type="checkbox" name="is_expired" id="is-expired-checkbox"
                        class="rounded border-gray-300 dark:border-gray-700 text-blue-600 focus:ring-blue-500 h-4 w-4"
                        onchange="const picker = document.getElementById('expiration-date-picker-container'); if (this.checked) { picker.classList.remove('hidden'); } else { picker.classList.add('hidden'); }">
                    <span>Track Expiration</span>
                </label>
            </div>
            
            <div id="expiration-date-picker-container" class="hidden flex items-center gap-1.5">
                <input type="datetime-local" name="expiration_date" id="expiration-date-picker"
                    class="border border-gray-300 dark:border-gray-700 rounded-md px-2 py-1 text-sm text-gray-750 dark:text-gray-250 focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white dark:bg-gray-800">
            </div>

            <!-- Upload Button -->
            <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-md text-sm font-medium transition-all shadow-sm hover:shadow flex items-center gap-1.5 select-none active:scale-[0.98]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Upload
            </button>

            <!-- Loading Indicator -->
            <div class="htmx-indicator ml-1">
                <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </div>
        </form>
    </div>

    <!-- Document List -->
    <div id="document-list" class="flex-1 overflow-y-auto p-4 space-y-2">
        {% include 'partials/document_items.html' %}
    </div>
</div>
