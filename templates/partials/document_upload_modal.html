<div id="document-modal-container" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 max-w-xl w-full overflow-hidden flex flex-col max-h-[90vh]">
        <!-- Header -->
        <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50 flex justify-between items-center">
            <div class="flex items-center gap-3 text-blue-600 dark:text-blue-400">
                <div class="p-2.5 bg-blue-50 dark:bg-blue-900/30 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-900 dark:text-white">Review & Enrich Metadata</h3>
                    <p class="text-xs text-gray-500">Google File Search 3-Step Ingestion Pipeline</p>
                </div>
            </div>
            <button type="button" onclick="document.getElementById('document-modal-container').remove()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6 overflow-y-auto space-y-5 flex-1">
            <!-- File Info Pill -->
            <div class="bg-blue-50/60 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900/50 p-3.5 rounded-xl flex items-center justify-between text-xs text-gray-700 dark:text-gray-300">
                <div>
                    <span class="font-bold text-gray-900 dark:text-white">{{ filename }}</span>
                    <span class="text-gray-400 ml-2">({{ file_size|filesizeformat }})</span>
                </div>
                <div class="font-mono text-gray-500 text-[11px]">
                    SHA-256: {{ content_hash|truncatechars:16 }}...
                </div>
            </div>

            <!-- Metadata Key-Value Editor -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
                        Custom Metadata Tags <span class="text-gray-400 font-normal">(Max 20 key-value pairs)</span>
                    </label>
                    <button type="button" onclick="addMetadataRow()" class="text-xs text-blue-600 dark:text-blue-400 hover:underline font-medium flex items-center gap-1">
                        + Add Tag
                    </button>
                </div>

                <div class="border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden shadow-sm">
                    <table class="w-full text-left text-xs" id="metadata-tags-table">
                        <thead class="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-semibold border-b border-gray-200 dark:border-gray-700">
                            <tr>
                                <th class="p-2.5 w-5/12">Key (Attribute)</th>
                                <th class="p-2.5 w-6/12">Value</th>
                                <th class="p-2.5 w-1/12 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-700 bg-white dark:bg-gray-800" id="metadata-rows-body">
                            {% for item in metadata_items %}
                            <tr class="metadata-row">
                                <td class="p-2">
                                    <input type="text" name="meta_key" value="{{ item.key }}" placeholder="key_name"
                                        class="w-full px-2 py-1 border border-gray-200 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-mono text-xs focus:ring-1 focus:ring-blue-500">
                                </td>
                                <td class="p-2">
                                    <input type="text" name="meta_val" value="{{ item.value }}" placeholder="value"
                                        class="w-full px-2 py-1 border border-gray-200 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-xs focus:ring-1 focus:ring-blue-500">
                                </td>
                                <td class="p-2 text-center">
                                    <button type="button" onclick="this.closest('tr').remove()" class="text-gray-400 hover:text-red-500 transition-colors">
                                        <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </td>
                            </tr>
                            {% empty %}
                            <tr class="metadata-row">
                                <td class="p-2">
                                    <input type="text" name="meta_key" value="department" placeholder="key_name"
                                        class="w-full px-2 py-1 border border-gray-200 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-mono text-xs focus:ring-1 focus:ring-blue-500">
                                </td>
                                <td class="p-2">
                                    <input type="text" name="meta_val" value="general" placeholder="value"
                                        class="w-full px-2 py-1 border border-gray-200 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-xs focus:ring-1 focus:ring-blue-500">
                                </td>
                                <td class="p-2 text-center">
                                    <button type="button" onclick="this.closest('tr').remove()" class="text-gray-400 hover:text-red-500 transition-colors">
                                        <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/80 flex justify-end gap-2.5">
            <button type="button" 
                onclick="document.getElementById('document-modal-container').remove()"
                style="padding: 8px 16px; font-size: 12px; font-weight: 600; color: #374151 !important; background: #ffffff !important; border: 1px solid #d1d5db !important; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;"
                class="px-4 py-2 text-xs font-semibold rounded-lg hover:bg-gray-100 transition-colors shadow-xs">
                Cancel
            </button>
            <button type="button"
                id="confirm-index-btn"
                onclick="submitMetadataAndUpload('{{ store_id }}')"
                style="padding: 8px 18px; font-size: 12px; font-weight: 600; color: #ffffff !important; background: #2563eb !important; border: 1px solid #1d4ed8 !important; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"
                class="px-5 py-2 text-xs font-semibold rounded-lg shadow-sm hover:shadow transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" style="width: 16px; height: 16px; stroke: #ffffff;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span style="color: #ffffff !important; font-weight: 600 !important;">Confirm & Index</span>
            </button>
        </div>
    </div>
</div>

<script>
function addMetadataRow() {
    const tbody = document.getElementById('metadata-rows-body');
    const row = document.createElement('tr');
    row.className = 'metadata-row';
    row.innerHTML = `
        <td class="p-2">
            <input type="text" name="meta_key" placeholder="key_name"
                class="w-full px-2 py-1 border border-gray-200 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 font-mono text-xs focus:ring-1 focus:ring-blue-500">
        </td>
        <td class="p-2">
            <input type="text" name="meta_val" placeholder="value"
                class="w-full px-2 py-1 border border-gray-200 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 text-xs focus:ring-1 focus:ring-blue-500">
        </td>
        <td class="p-2 text-center">
            <button type="button" onclick="this.closest('tr').remove()" class="text-gray-400 hover:text-red-500 transition-colors">
                <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </td>
    `;
    tbody.appendChild(row);
}

function submitMetadataAndUpload(storeId) {
    const rows = document.querySelectorAll('#metadata-rows-body .metadata-row');
    const metadata = [];
    rows.forEach(r => {
        const k = r.querySelector('input[name="meta_key"]')?.value?.trim();
        const v = r.querySelector('input[name="meta_val"]')?.value?.trim();
        if (k && v !== undefined && v !== '') {
            metadata.push({ key: k, value: v });
        }
    });

    const form = document.querySelector('#file-uploader-input')?.form;
    const fileInput = document.getElementById('file-uploader-input');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert('Please choose a file first.');
        return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('custom_metadata', JSON.stringify(metadata));

    const btn = document.getElementById('confirm-index-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<svg class="animate-spin h-4 w-4 text-white inline mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Indexing...';
    }

    fetch(`/rag/documents/${storeId}/upload/`, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    }).then(response => response.text())
      .then(html => {
          document.getElementById('document-modal-container')?.remove();
          const docList = document.getElementById('document-list');
          if (docList) {
              docList.innerHTML = html;
          }
      }).catch(err => {
          alert('Upload failed: ' + err);
          if (btn) {
              btn.disabled = false;
              btn.innerHTML = 'Confirm & Index';
          }
      });
}
</script>
