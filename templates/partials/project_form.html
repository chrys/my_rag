<div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm p-6 max-w-2xl mx-auto">
    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100 dark:border-gray-700">
        <div class="p-2.5 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
        </div>
        <div>
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">Create New Knowledge Project</h2>
            <p class="text-xs text-gray-500">Configure storage backend, ingestion pipeline & synthesis model</p>
        </div>
    </div>

    <!-- Error Banner Container -->
    <div id="project-error-container"></div>

    <form hx-post="/rag/projects/create/"
          hx-target="#project-list-container"
          hx-swap="innerHTML"
          class="space-y-5">
        
        <!-- Display Name -->
        <div>
            <label for="project-display-name" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                Project Name <span class="text-red-500">*</span>
            </label>
            <input type="text" id="project-display-name" name="display_name" required placeholder="e.g. Technical Documentation, Financial Reports"
                class="w-full px-3.5 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
        </div>

        <!-- Storage Type -->
        <div>
            <label for="project-storage-type" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                Storage Engine Backend <span class="text-red-500">*</span>
            </label>
            <select id="project-storage-type" name="storage_type" onchange="onStorageTypeChanged(this.value)"
                class="w-full px-3.5 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="postgres" selected>Postgres RAG (Self-Hosted pgvector VPS)</option>
                <option value="google">Google File Search (Managed Enterprise Cloud Store)</option>
            </select>
        </div>

        <!-- LLM Model Selector -->
        <div>
            <label for="project-llm-model" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                Synthesis & Chat Model
            </label>
            <select id="project-llm-model" name="llm_model"
                class="w-full px-3.5 py-2 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="gemini-2.5-flash-lite" selected>gemini-2.5-flash-lite (Cheapest & Fastest)</option>
                <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (Next-Gen Flash)</option>
                <option value="gemini-3.7-flash">gemini-3.7-flash (Hybrid Reasoning & Advanced Retrieval)</option>
                <option value="gemma4:12b-mlx" class="local-model-option">gemma4:12b-mlx (Local Ollama)</option>
                <option value="gemma4:e4b-mlx" class="local-model-option">gemma4:e4b-mlx (Local Ollama - Balanced)</option>
                <option value="gemma4:e2b-mlx" class="local-model-option">gemma4:e2b-mlx (Local Ollama - Ultra Fast)</option>
            </select>
        </div>

        <!-- GFS Parameter Notice Banner -->
        <div id="gfs-parameter-notice" class="hidden p-3.5 bg-blue-50/80 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 rounded-xl text-xs text-blue-800 dark:text-blue-200">
            <div class="flex items-start gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div>
                    <strong>Google File Search Managed Mode:</strong> Chunking (Managed) and Embedding (server-side <code class="bg-blue-100 dark:bg-blue-900 px-1 py-0.5 rounded font-mono">text-embedding-004</code>) are automatically optimized by Google Cloud. HyDE, Synthesizer, and Response Mode are disabled.
                </div>
            </div>
        </div>

        <!-- Postgres Advanced Parameters (Hidden for GFS) -->
        <div id="postgres-parameters-container" class="space-y-4 pt-2 border-t border-gray-100 dark:border-gray-700">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Response Mode</label>
                    <select name="response_mode" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700">
                        <option value="compact" selected>Compact (Fastest)</option>
                        <option value="refine">Refine (Multi-Chunk Iteration)</option>
                        <option value="tree_summarize">Tree Summarize</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Chunking Strategy</label>
                    <select name="chunking" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700">
                        <option value="fixed-size" selected>Fixed-Size (512 tokens)</option>
                        <option value="semantic">Semantic Splitter</option>
                        <option value="markdown">Markdown Header Splitter</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center gap-6 pt-2">
                <label class="inline-flex items-center gap-2 text-xs text-gray-700 dark:text-gray-300 cursor-pointer">
                    <input type="checkbox" name="use_hyde" class="rounded text-blue-600 focus:ring-blue-500">
                    <span>Enable Adaptive HyDE</span>
                </label>
                <label class="inline-flex items-center gap-2 text-xs text-gray-700 dark:text-gray-300 cursor-pointer">
                    <input type="checkbox" name="synthesizer" class="rounded text-blue-600 focus:ring-blue-500">
                    <span>Enable Multi-Pass Synthesizer</span>
                </label>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-4 flex justify-end">
            <button type="submit" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-sm hover:shadow transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span>Create Project</span>
            </button>
        </div>
    </form>
</div>

<script>
function onStorageTypeChanged(storageType) {
    const gfsNotice = document.getElementById('gfs-parameter-notice');
    const postgresParams = document.getElementById('postgres-parameters-container');
    const localOptions = document.querySelectorAll('.local-model-option');
    const llmSelect = document.getElementById('project-llm-model');

    if (storageType === 'google') {
        if (gfsNotice) gfsNotice.classList.remove('hidden');
        if (postgresParams) postgresParams.classList.add('hidden');
        localOptions.forEach(opt => {
            opt.disabled = true;
            opt.classList.add('hidden');
        });
        if (llmSelect && !['gemini-2.5-flash-lite', 'gemini-3.5-flash-lite', 'gemini-3.7-flash'].includes(llmSelect.value)) {
            llmSelect.value = 'gemini-2.5-flash-lite';
        }
    } else {
        if (gfsNotice) gfsNotice.classList.add('hidden');
        if (postgresParams) postgresParams.classList.remove('hidden');
        localOptions.forEach(opt => {
            opt.disabled = false;
            opt.classList.remove('hidden');
        });
    }
}
</script>
