{% for doc in documents %}
<div
    data-evaluate-doc-id="{{ doc.name }}"
    class="evaluate-file-item p-3 bg-white border border-gray-200 rounded-lg hover:border-blue-300 hover:bg-blue-50 transition-all cursor-pointer"
    onclick="selectEvaluateFile('{{ doc.name }}', '{{ doc.display_name }}')">
    <div class="flex items-center gap-3">
        <div class="bg-blue-100 text-blue-600 p-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        </div>
        <div class="flex-1 min-w-0">
            <h4 class="font-medium text-gray-800 truncate">{{ doc.display_name }}</h4>
            <p class="text-xs text-gray-500 truncate">{{ doc.name }}</p>
        </div>
        <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full font-medium whitespace-nowrap">{{ doc.state.name }}</span>
    </div>
</div>
{% empty %}
<div class="text-center py-8 text-gray-500">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2 opacity-20" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <p class="text-sm">No documents available.</p>
</div>
{% endfor %}
