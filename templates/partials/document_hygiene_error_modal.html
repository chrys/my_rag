<div id="document-modal-container" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-fade-in" style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5);">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 max-w-sm w-full overflow-hidden" style="background: #ffffff; border-radius: 12px; max-width: 400px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); border: 1px solid #e5e7eb;">
        
        <!-- Header -->
        <div style="padding: 14px 16px; background: #fef2f2; border-bottom: 1px solid #fee2e2; display: flex; align-items: center; gap: 10px;">
            <div style="padding: 6px; background: #fecaca; color: #dc2626; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" style="width: 20px; height: 20px; stroke: #dc2626;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div>
                <h3 style="margin: 0; font-size: 14px; font-weight: 700; color: #991b1b;">Hygiene Check Failed</h3>
                <p style="margin: 0; font-size: 11px; color: #b91c1c;">Pre-flight file validation rejected</p>
            </div>
        </div>

        <!-- Body -->
        <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <div style="background: #fff1f2; border: 1px solid #fecdd3; padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #9f1239; font-weight: 500;">
                {{ error_message }}
            </div>

            <div style="background: #f9fafb; padding: 10px 12px; border-radius: 8px; border: 1px solid #e5e7eb; font-size: 12px; display: flex; flex-direction: column; gap: 4px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #6b7280; font-weight: 500;">File:</span>
                    <strong style="color: #111827; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ filename }}</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: #6b7280; font-weight: 500;">Size:</span>
                    <span style="color: #374151; font-mono text-[11px]">{{ file_size }} bytes</span>
                </div>
            </div>

            <p style="margin: 0; font-size: 11px; color: #6b7280; line-height: 1.4;">
                Please ensure the file is a supported format (.pdf, .txt, .md, .csv, .json, .docx, .html) and contains readable content.
            </p>
        </div>

        <!-- Action Button -->
        <div style="padding: 12px 16px; background: #f9fafb; border-top: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: flex-end;">
            <button type="button" 
                onclick="document.getElementById('document-modal-container').remove()"
                style="padding: 8px 16px; font-size: 12px; font-weight: 600; color: #374151 !important; background: #ffffff !important; border: 1px solid #d1d5db !important; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                Close
            </button>
        </div>
    </div>
</div>
